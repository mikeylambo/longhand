    <title>Foolscap</title>

    <!--
      The splash.

      Inline, in the document, above the module script — so it paints on the
      first parse rather than after a 300 KB bundle has been fetched, parsed
      and mounted. An installed app that opens on white for half a second
      reads as broken in a way the same half-second behind a wordmark does
      not, and iOS gives a standalone PWA no splash of its own unless it is
      handed a startup image per device size.

      The colours are literals rather than custom properties because
      styles.css has not loaded yet when this first paints. They are
      --chrome and --ink; if those change, these change with them.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #e7e0d2;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-size: 30px;
        letter-spacing: 0.01em;
        color: #1b1a17;
        /* Paint, then settle. Instant text is a flash; this is a fade in that
           is over before anyone who is waiting has noticed it start. */
        animation: boot-in 0.5s ease-out both;
      }
      /* Sized off the viewport so it is the same size relative to the screen
         on a phone and on a desktop, and capped so it never becomes a poster. */
      #boot .boot-mark {
        width: auto;
        height: min(22vh, 148px);
        display: block;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* Set by main.tsx once React has painted something real. Transition
         rather than removal so the wordmark hands over instead of blinking. */
      #boot.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.34s ease-in;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot.done {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
