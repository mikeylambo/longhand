<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#E7E0D2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foolscap" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <meta
      name="description"
      content="A museum the world fills in, one stranger at a time. Twelve hands, one drawing."
    />
    <meta property="og:title" content="Foolscap" />
    <meta
      property="og:description"
      content="A museum the world fills in, one stranger at a time."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Foolscap</title>

    <!--
      The splash.

      Inline, in the document, above the module script — so it paints on the
      first parse rather than after a 300 KB bundle has been fetched, parsed
      and mounted. An installed app that opens on white for half a second
      reads as broken in a way the same half-second behind a wordmark does
      not, and iOS gives a standalone PWA no splash of its own unless it is
      handed a startup image per device size.

      The colours are literals rather than custom properties because
      styles.css has not loaded yet when this first paints. They are
      --chrome and --ink; if those change, these change with them.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e7e0d2;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-size: 30px;
        letter-spacing: 0.01em;
        color: #1b1a17;
        /* Paint, then settle. Instant text is a flash; this is a fade in that
           is over before anyone who is waiting has noticed it start. */
        animation: boot-in 0.5s ease-out both;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* Set by main.tsx once React has painted something real. Transition
         rather than removal so the wordmark hands over instead of blinking. */
      #boot.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.34s ease-in;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot.done {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Foolscap is opening">Foolscap</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
